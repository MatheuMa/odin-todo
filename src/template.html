<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin-todo</title>
</head>

<body>
    <div class="app todo-selected">
        <aside class="side-bar">
            <div>
                <div class="title">
                    <img src="assets/images/odin.png" alt="todo app logo">
                    <h1>Odin Todo</h1>
                </div>

                <div class="projects">
                    <h2>PROJECTS</h2>
                    <ul></ul>
                    <div class="new-proj-container">
                        <button class="new-project">+ New Project</button>
                    </div>
                </div>
            </div>

            <div class="more-actions">
                <button>
                    <img src="assets/images/setting.png" alt="settings icon">
                    <span>Settings</span>
                </button>
                <button>
                    <img src="assets/images/logout.png" alt="log out icon">
                    <span>Log Out</span>
                </button>
            </div>
        </aside>

        <main class="todo-list">
        </main>

        <aside class="todo-detail">
            <div class="detail-header">
                <h2>Todo Details</h2>
                <button type="button" aria-label="Close todo details">
                    <img src="assets/images/close.png" alt="close button">
                </button>
            </div>

            <form class="todo-form">
                <div>
                    <label for="todo-title">Title</label>
                    <input type="text" id="todo-title" name="todo-title" required>
                </div>

                <div>
                    <label for="todo-description">Description</label>
                    <textarea id="todo-description" name="todo-description"></textarea>
                </div>

                <div>
                    <label for="todo-due">Due Date</label>
                    <input type="date" id="todo-due" name="todo-due-date" required>
                </div>

                <div>
                    <label for="todo-priority">Priority</label>
                    <select name="todo-priority" id="todo-priority" required>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>
                </div>

                <div>
                    <label for="todo-notes">Notes</label>
                    <textarea name="todo-notes" id="todo-notes"></textarea>
                </div>

                <div class="todo-btns">
                    <button type="submit">Save Changes</button>
                    <button type="button" class="delete-btn">
                        <span>Delete</span>
                    </button>
                </div>
            </form>
        </aside>
    </div>
</body>

</html>
