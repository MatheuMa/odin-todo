<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin-todo</title>
<script defer src="main.js"></script></head>

<body>
    <div class="app">
        <aside class="side-bar">
            <div>
                <div class="title">
                    <img src="6636c2410c78b7322c3a.png" alt="todo app logo">
                    <h1>Odin Todo</h1>
                </div>

                <div class="projects">
                    <h2>PROJECTS</h2>
                    <ul></ul>
                    <div class="new-proj-container">
                        <button class="new-project">+ New Project</button>
                    </div>
                </div>
            </div>

            <div class="more-actions">
                <button>
                    <img src="d253e01d5104acb9826b.png" alt="settings icon">
                    <span>Settings</span>
                </button>
                <button>
                    <img src="0becdbc391b7088ace83.png" alt="log out icon">
                    <span>Log Out</span>
                </button>
            </div>
        </aside>

        <main class="todo-list">
        </main>

        <aside class="todo-detail">
        </aside>
    </div>

    <dialog class="edit-project-name">
        <form class="rename-project-form">
            <div>
                <h3 class="rename-title" for="rename-input">
                    New project name:
                </h3>

                <input class="rename-input" id="rename-input" name="projectTitle" type="text" required>
            </div>

            <div class="rename-buttons">
                <button class="save-name" type="submit">
                    Save
                </button>

                <button class="cancel-rename" type="button" data-action="cancel-rename">
                    Cancel
                </button>
            </div>
        </form>
    </dialog>
</body>

</html>
